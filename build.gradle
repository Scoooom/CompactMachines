buildscript {
    repositories {
        jcenter()
        maven { url = "http://files.minecraftforge.net/maven" }
    }
    dependencies {
        classpath 'net.minecraftforge.gradle:ForgeGradle:2.3-SNAPSHOT'
    }
}
apply plugin: 'net.minecraftforge.gradle.forge'

version = "${minecraft_version}-${mod_version}"
group = "org.dave.compactmachines3" // http://maven.apache.org/guides/mini/guide-naming-conventions.html
archivesBaseName = "compactmachines3"

sourceCompatibility = targetCompatibility = "1.8" // Need this here so eclipse task generates correctly.
compileJava {
    sourceCompatibility = targetCompatibility = "1.8"
}

minecraft {
    version = "${minecraft_version}-${forge_version}"
    runDir = "run"

    mappings = "stable_39"

    replaceIn "CompactMachines3.java"
    replace "@VERSION@", project.mod_version
}

repositories {
    maven { // location of the maven that hosts JEI files
        name "Progwml6 maven"
        url "https://dvs1.progwml6.com/files/maven"
    }
    maven {
        name = "opencomputers"
        url = "http://maven.cil.li/"
    }
    // local lib dir for everything else
    flatDir {
        dirs 'lib'
    }
}

dependencies {
    deobfCompile "mezz.jei:jei_${minecraft.version}:${jei_version}:api"

    deobfCompile fileTree(dir: 'lib', include: 'Hwyla-*.jar')
    deobfCompile fileTree(dir: 'lib', include: 'theoneprobe-*.jar')
    deobfCompile fileTree(dir: 'lib', include: 'refinedstorage-*-api.jar')
    deobfCompile "li.cil.oc:OpenComputers:${oc_version}:api"
    deobfCompile fileTree(dir: 'lib', include: 'ThermalDynamics-*.jar')
    deobfCompile fileTree(dir: 'lib', include: 'CoFHCore-*.jar')

    runtime fileTree(dir: 'lib', include: 'ThermalFoundation-*.jar')
    runtime fileTree(dir: 'lib', include: 'ThermalExpansion-*.jar')
    runtime fileTree(dir: 'lib', include: 'CodeChickenLib-*.jar')
}

allprojects {
    if (System.getenv("TRAVIS") != null) {
        def tag = System.getenv("TRAVIS_TAG");
        if (tag != null && !tag.isEmpty() && tag.contains("release")) {
            project.ext.releaseType = "release"
        } else {
            version += "-b${System.getenv("TRAVIS_BUILD_NUMBER")}"
            project.ext.releaseType = "beta"
        }
    }
}

task deobfJar(type: Jar) {
    from sourceSets.main.output
    classifier = 'deobf'
}

processResources
{
    // this will ensure that this task is redone when the versions change.
    inputs.property "version", project.version
    inputs.property "mcversion", project.minecraft.version

    // replace stuff in mcmod.info, nothing else
    from(sourceSets.main.resources.srcDirs) {
        include 'mcmod.info'

        // replace version and mcversion
        expand 'version':project.version, 'mcversion':project.minecraft.version
    }

    // copy everything else, thats not the mcmod.info
    from(sourceSets.main.resources.srcDirs) {
        exclude 'mcmod.info'
    }
}
